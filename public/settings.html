<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Settings</title><link rel="stylesheet" href="/admin-suite.css">  <link rel="manifest" href="/manifest.webmanifest">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="shell"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>GOLDEN GHOST</b><small>System Settings</small></div></div><nav class="nav"><a href="/dashboard.html">🏠 Dashboard</a><a href="/users.html">👥 Users</a><a href="/transactions.html">💳 Transactions</a><a href="/payments.html">💰 Payments</a><a href="/reports.html">📊 Reports</a><a href="/notifications.html">🔔 Notifications</a><a href="/settings.html">⚙️ Settings</a><a href="/security.html">🛡️ Security</a><a href="/system-health.html">🩺 System Health</a></nav></aside><main class="main"><div class="top"><div><h1>Settings</h1><div class="muted">Configuration huhifadhiwa database. Hakuna default fake values.</div></div></div><div class="card"><div class="form-grid"><div class="field"><label>Site name</label><input id="site_name"></div><div class="field"><label>Default currency</label><input id="default_currency" placeholder="TZS"></div><div class="field"><label>Maintenance mode</label><select id="maintenance_mode"><option value="">Haijawekwa</option><option value="true">true</option><option value="false">false</option></select></div><div class="field"><label>Registration status</label><select id="registration_open"><option value="">Haijawekwa</option><option value="true">true</option><option value="false">false</option></select></div></div><div class="actions"><button class="btn gold" onclick="save()">Save settings</button><button class="btn" onclick="load()">Reload</button></div><div id="msg" class="notice" style="display:none"></div></div><div class="card" style="margin-top:18px"><h3>Stored settings</h3><div class="table-wrap"><table class="table"><thead><tr><th>Key</th><th>Value</th><th>Updated</th></tr></thead><tbody id="all"></tbody></table></div></div></main></div><script src="/admin-suite.js"></script><script>const keys=['site_name','default_currency','maintenance_mode','registration_open'];async function load(){try{const j=await api('/api/admin/settings');const map=Object.fromEntries(j.settings.map(x=>[x.key,x]));keys.forEach(k=>document.getElementById(k).value=map[k]?.value||'');document.getElementById('all').innerHTML=j.settings.length?j.settings.map(x=>`<tr><td>${esc(x.key)}</td><td>${esc(x.value)}</td><td>${esc(x.updated_at)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Hakuna settings zilizohifadhiwa.</td></tr>'}catch(e){alert(e.message)}}async function save(){try{for(const k of keys){const v=document.getElementById(k).value;if(v!=='')await api('/api/admin/settings/'+k,{method:'PUT',body:JSON.stringify({value:v})})}document.getElementById('msg').style.display='block';document.getElementById('msg').textContent='Settings zimehifadhiwa.';load()}catch(e){alert(e.message)}}load()</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
