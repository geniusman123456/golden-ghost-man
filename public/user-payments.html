<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Payment Center</title><link rel="stylesheet" href="/admin-suite.css"><style>body{background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#ffd21f;font-weight:900;font-size:22px}.nav{color:#ffd21f}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.panel{background:#0b0e0f;border:1px solid #3b3100;border-radius:20px;padding:20px;margin-top:18px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #39331b;background:#090c0d;color:#fff;margin:6px 0}button{background:#ffd21f;color:#080808;font-weight:900;cursor:pointer}.muted{color:#899197}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.method{padding:12px;border:1px solid #292d2f;border-radius:12px;text-align:center}.ok{color:#55df9a}.no{color:#ff6d75}.table{overflow:auto}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #202526;text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr}.methods{grid-template-columns:1fr 1fr}}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="top"><div><div class="brand">GOLDEN GHOST</div><div class="muted">Payment Center</div></div><a class="nav" href="/user-dashboard.html">← Dashboard</a></div><div class="grid"><section class="panel"><h2>💳 Start Payment</h2><select id="method"><option value="visa">Visa</option><option value="mastercard">Mastercard</option><option value="mpesa">M-Pesa</option><option value="airtel_money">Airtel Money</option><option value="tigo_pesa">Tigo Pesa</option><option value="bank_transfer">Bank Transfer</option></select><input id="amount" type="number" min="1" step="0.01" placeholder="Amount TZS"><input id="phone" placeholder="Phone for mobile money (optional)"><button id="pay">Continue</button><div id="msg" class="muted"></div><h3>Available methods</h3><div class="methods" id="methods">Loading...</div></section><section class="panel"><h2>Payment History</h2><div class="table"><table><thead><tr><th>ID</th><th>Method</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></div></main><script>const money=n=>'TZS '+(Number(n||0)/100).toLocaleString('en-TZ',{minimumFractionDigits:2});async function load(){const [a,b]=await Promise.all([fetch('/api/user/payment-methods'),fetch('/api/user/payments')]);if(a.status===401){location='/login.html';return}const md=await a.json(),pd=await b.json();document.getElementById('methods').innerHTML=(md.methods||[]).map(x=>`<div class="method"><b>${x.method}</b><div class="${x.configured?'ok':'no'}">${x.configured?'Configured':'Not configured'}</div></div>`).join('');document.getElementById('rows').innerHTML=(pd.payments||[]).map(x=>`<tr><td>#${x.id}</td><td>${x.method}</td><td>${money(x.amount_cents)}</td><td>${x.status}</td><td>${x.created_at}</td></tr>`).join('')||'<tr><td colspan="5">No payments yet.</td></tr>'}document.getElementById('pay').onclick=async()=>{const msg=document.getElementById('msg');const amount=Number(document.getElementById('amount').value);if(!Number.isFinite(amount)||amount<=0){msg.textContent='Weka amount sahihi.';return}const r=await fetch('/api/user/payments',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':'gg-'+crypto.randomUUID()},body:JSON.stringify({method:document.getElementById('method').value,amount,currency:'TZS',phone:document.getElementById('phone').value.trim()})});const d=await r.json();msg.textContent=d.message||'Imeshindikana.';if(r.ok&&d.payment?.checkout_url)location.href=d.payment.checkout_url;load()};load();</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
