<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover People • Golden Ghost</title><link rel="stylesheet" href="/admin-suite.css"><style>
body{background:#050606;color:#f7f7f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-weight:800;color:#ffd21f;font-size:24px}.sub{color:#8e9698}.panel{background:linear-gradient(145deg,#0d1112,#080909);border:1px solid #4b3a00;border-radius:20px;padding:22px;box-shadow:0 0 35px #000}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;margin:20px 0}input,select{width:100%;box-sizing:border-box;background:#11171a;border:1px solid #283033;color:#fff;border-radius:12px;padding:13px}button,.btn{border:0;border-radius:12px;padding:13px 18px;background:#ffd21f;color:#111;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.person{border:1px solid #2b2f30;background:#0b0e0f;border-radius:18px;padding:18px}.avatar{width:58px;height:58px;border-radius:50%;border:2px solid #ffd21f;object-fit:cover;background:#181818}.row{display:flex;gap:14px;align-items:center}.name{font-weight:800}.meta{color:#9da4a6;font-size:13px;margin-top:3px}.actions{display:flex;gap:8px;margin-top:18px}.ghost{background:transparent;color:#ffd21f;border:1px solid #ffd21f}.empty{padding:35px;text-align:center;color:#8e9698}.nav{color:#ffd21f;text-decoration:none}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="top"><div><div class="brand">GOLDEN GHOST</div><div class="sub">Discover people. Connect globally. One Community. One World.</div></div><a class="nav" href="/user-dashboard.html">← Dashboard</a></div><section class="panel"><h1>🌍 Discover People</h1><div class="sub">Tafuta members wa Golden Ghost kwa jina, nchi au lugha.</div><div class="filters"><input id="q" placeholder="Search name, username or country..."><input id="country" placeholder="Country"><input id="language" placeholder="Language"><button id="search">Search</button></div><div id="grid" class="grid"><div class="empty">Loading...</div></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});if(r.status===401){location='/login.html';throw Error('AUTH')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
async function load(){const p=new URLSearchParams();if($('q').value.trim())p.set('search',$('q').value.trim());if($('country').value.trim())p.set('country',$('country').value.trim());if($('language').value.trim())p.set('language',$('language').value.trim());const d=await api('/api/user/discover?'+p);$('grid').innerHTML=(d.people||[]).map(x=>`<article class="person"><div class="row"><img class="avatar" src="logo.png"><div><div class="name">${esc(x.full_name||x.username)}</div><div class="meta">@${esc(x.username)} • ${esc(x.country||'Global')}</div><div class="meta">${esc(x.language||'Language not set')}</div></div></div><div class="actions"><button onclick="connect(${x.id},this)">${x.connection_status==='accepted'?'Connected':x.connection_status==='pending'?'Requested':'Connect'}</button><button class="ghost" onclick="message(${x.id})">Message</button></div></article>`).join('')||'<div class="empty">Hakuna members wanaolingana na search yako.</div>'}
async function connect(id,b){if(b.textContent!=='Connect')return;b.disabled=true;try{await api('/api/user/connections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id})});b.textContent='Requested'}catch(e){alert(e.message)}finally{b.disabled=false}}
function message(id){location='/chat.html?user='+id}$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
