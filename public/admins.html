<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Management — Golden Ghost</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#070707;color:#eee;min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:#999;font-size:13px}.actions{display:flex;gap:10px}.btn{border:1px solid #333;background:#111;color:#eee;border-radius:10px;padding:11px 15px;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#d9a928,#ffe082);color:#111;border:0;font-weight:700}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.card{background:#0d0d0d;border:1px solid #252525;border-radius:16px;padding:20px;box-shadow:0 12px 35px #0008}.card h2{font-size:17px;margin:0 0 6px}.muted{color:#999;font-size:13px;margin:0 0 18px}.field{margin-bottom:13px}.field label{display:block;color:#bbb;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border-radius:9px;border:1px solid #333;background:#080808;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:#d9a928}.table-wrap{overflow:auto}.notice{min-height:20px;margin:10px 0;color:#f2cf63;font-size:13px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid #242424;font-size:13px}.table th{color:#999;font-weight:600}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:11px}.active{background:#12351e;color:#6ee58a}.off{background:#351616;color:#ff8c8c}.role{color:#f0cf67}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.empty{text-align:center;padding:40px;color:#777}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal .card{width:430px;max-width:100%}.close{float:right;background:none;border:0;color:#999;font-size:22px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style>

<style>
.top{position:relative;overflow:hidden}.top::after{content:"";position:absolute;right:0;top:0;width:260px;height:100%;background:url('ghost-wide.png') center/cover;opacity:.12;pointer-events:none}.card{position:relative;overflow:hidden}.card::after{content:"";position:absolute;right:-30px;bottom:-35px;width:150px;height:110px;background:url('ghost-cinematic.png') center/cover;border-radius:20px;opacity:.1;pointer-events:none}
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="Golden Ghost"><div><h1>Admin Management</h1><p>Usimamizi wa akaunti za wasimamizi wa mfumo</p></div></div>
    <div class="actions"><button class="btn" onclick="location.href='/dashboard.html'">← Dashboard</button><button class="btn gold" onclick="openCreate()">+ Ongeza Admin</button></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Admin aliyeingia</h2><p class="muted">Taarifa kutoka database.</p>
      <div id="me">Inapakia...</div>
    </div>
    <div class="card">
      <h2>Wasimamizi wa Mfumo</h2><p class="muted">Hapa utaona na kusimamia admin accounts zilizopo.</p>
      <div id="notice" class="notice"></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th>Vitendo</th></tr></thead><tbody id="admins"><tr><td colspan="5" class="empty">Inapakia...</td></tr></tbody></table></div>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Ongeza Admin</h2><p class="muted">Jaza taarifa zinazohitajika.</p><form id="adminForm"><input type="hidden" id="adminId"><div class="field"><label>Username</label><input id="username" required minlength="3" maxlength="40"></div><div class="field" id="passwordField"><label>Password</label><input id="password" type="password" minlength="8" placeholder="Angalau herufi 8"></div><div class="field"><label>Role</label><select id="role"><option value="admin">Admin</option><option value="super_admin">Super Admin</option></select></div><div class="field" id="statusField"><label>Status</label><select id="status"><option value="1">Active</option><option value="0">Inactive</option></select></div><button class="btn gold" type="submit">Hifadhi</button></form></div></div>
<script>
let admins=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin-login.html';throw Error('Session expired')}if(!r.ok)throw Error(d.message||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){try{const me=await api('/api/admin/me');document.getElementById('me').innerHTML=`<div style="font-size:18px;font-weight:700">${esc(me.username)}</div><div style="margin-top:8px;color:#d9b84d">${esc(me.role)}</div><div style="margin-top:10px;color:#888;font-size:12px">Account ID: ${me.id}</div>`;const d=await api('/api/admin/admins');admins=d.admins;render()}catch(e){document.getElementById('notice').textContent=e.message}}
function render(){const b=document.getElementById('admins');if(!admins.length){b.innerHTML='<tr><td colspan="5" class="empty">Hakuna admin.</td></tr>';return}b.innerHTML=admins.map(a=>`<tr><td><b>${esc(a.username)}</b></td><td class="role">${esc(a.role)}</td><td><span class="badge ${a.is_active?'active':'off'}">${a.is_active?'Active':'Inactive'}</span></td><td>${esc(a.last_login_at||'—')}</td><td><div class="row-actions"><button class="btn small" onclick="editAdmin(${a.id})">Hariri</button><button class="btn small" onclick="changePass(${a.id})">Password</button>${a.is_active?`<button class="btn small" onclick="toggleAdmin(${a.id},0)">Zima</button>`:`<button class="btn small" onclick="toggleAdmin(${a.id},1)">Washa</button>`}</div></td></tr>`).join('')}
function openCreate(){document.getElementById('modalTitle').textContent='Ongeza Admin';document.getElementById('adminId').value='';document.getElementById('username').value='';document.getElementById('password').value='';document.getElementById('role').value='admin';document.getElementById('statusField').style.display='none';document.getElementById('passwordField').style.display='block';document.getElementById('password').required=true;document.getElementById('modal').classList.add('open')}
function editAdmin(id){const a=admins.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Hariri Admin';document.getElementById('adminId').value=id;document.getElementById('username').value=a.username;document.getElementById('password').value='';document.getElementById('role').value=a.role;document.getElementById('status').value=a.is_active?'1':'0';document.getElementById('statusField').style.display='block';document.getElementById('passwordField').style.display='none';document.getElementById('password').required=false;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('adminId').value;try{if(!id){await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username:username.value,password:password.value,role:role.value})});}else{await api('/api/admin/admins/'+id,{method:'PUT',body:JSON.stringify({username:username.value,role:role.value,is_active:Number(status.value)})})}closeModal();notice.textContent='Mabadiliko yamehifadhiwa.';await load()}catch(err){notice.textContent=err.message}}
async function toggleAdmin(id,status){try{await api('/api/admin/admins/'+id,{method:'PUT',body:JSON.stringify({is_active:status})});notice.textContent='Status imebadilishwa.';await load()}catch(e){notice.textContent=e.message}}
async function changePass(id){const p=prompt('Weka password mpya (angalau herufi 8):');if(!p)return;try{await api('/api/admin/admins/'+id+'/password',{method:'PUT',body:JSON.stringify({password:p})});notice.textContent='Password imebadilishwa.'}catch(e){notice.textContent=e.message}}
load();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
