<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Reports</title><link rel="stylesheet" href="/admin-suite.css">  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="shell"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>GOLDEN GHOST</b><small>Admin Reports</small></div></div><nav class="nav"><a href="/dashboard.html">🏠 Dashboard</a><a href="/users.html">👥 Users</a><a href="/transactions.html">💳 Transactions</a><a href="/payments.html">💰 Payments</a><a href="/reports.html">📊 Reports</a><a href="/notifications.html">🔔 Notifications</a><a href="/settings.html">⚙️ Settings</a><a href="/security.html">🛡️ Security</a><a href="/system-health.html">🩺 System Health</a></nav></aside><main class="main"><div class="top"><div><h1>Reports</h1><div class="muted">Takwimu zinazotokana na database halisi pekee.</div></div><button class="btn" onclick="location.reload()">↻ Refresh</button></div><div id="summary" class="grid"></div><div class="card" style="margin-top:18px"><div class="toolbar"><select id="days"><option value="7">Siku 7</option><option value="30" selected>Siku 30</option><option value="90">Siku 90</option></select><button class="btn gold" onclick="loadReport()">Angalia</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tarehe</th><th>Aina</th><th>Status</th><th>Count</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="footer">Golden Ghost • No invented statistics</div></main></div><script src="/admin-suite.js"></script><script>async function load(){const s=await api('/api/admin/reports/summary');const cards=[['Users',s.users.count],['Active Users',s.activeUsers.count],['Admins',s.admins.count],['Wallet Balance',money(s.walletBalance.amount)],['Completed Deposits',money(s.depositCompleted.amount)],['Completed Withdrawals',money(s.withdrawalCompleted.amount)],['Pending',s.pending.count],['Failed',s.failed.count]];document.getElementById('summary').innerHTML=cards.map(x=>`<div class="card"><div class="muted">${esc(x[0])}</div><div class="num">${esc(x[1])}</div></div>`).join('');loadReport()}async function loadReport(){const j=await api('/api/admin/reports/daily?days='+document.getElementById('days').value);document.getElementById('rows').innerHTML=j.rows.length?j.rows.map(r=>`<tr><td>${esc(r.day)}</td><td>${esc(r.type)}</td><td>${esc(r.status)}</td><td>${esc(r.count)}</td><td>${money(r.amount_cents)}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">Hakuna data katika kipindi hiki.</td></tr>`}load().catch(e=>alert(e.message))</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
