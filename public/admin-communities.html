<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Communities • Golden Ghost</title><link rel="stylesheet" href="/admin-suite.css"><style>body{background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.gold{color:#ffd21f}.panel{background:#0b0e0f;border:1px solid #3b3100;border-radius:20px;padding:20px;margin-top:18px}.filters{display:flex;gap:8px}.filters input,.filters select{flex:1;padding:11px;border-radius:9px;border:1px solid #303436;background:#090c0d;color:#fff}.btn{padding:9px 12px;border-radius:8px;border:1px solid #5a4700;background:#ffd21f;color:#080808;font-weight:900;cursor:pointer}.btn.dark{background:#0c0e0f;color:#ffd21f}.table{overflow:auto}table{width:100%;min-width:1000px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #202526;text-align:left}.muted{color:#899197}.active{color:#55df9a}.disabled{color:#ff6d75}.post{padding:13px;border-bottom:1px solid #202526}.actions{display:flex;gap:6px;flex-wrap:wrap}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="top"><div><h1 class="gold">Golden Ghost</h1><div class="muted">Community moderation & governance</div></div><a class="gold" href="/dashboard.html">← Admin Dashboard</a></div><section class="panel"><h2>🌍 Communities</h2><div class="filters"><input id="q" placeholder="Search community / owner..."><select id="status"><option value="">All</option><option value="active">Active</option><option value="disabled">Disabled</option></select><button class="btn" onclick="load()">Search</button></div><div class="table"><table><thead><tr><th>Community</th><th>Owner</th><th>Category</th><th>Privacy</th><th>Members</th><th>Posts</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></section><section class="panel"><h2>📝 Recent Community Posts</h2><div id="posts">Loading...</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u,o={}){const r=await fetch(u,o);if(r.status===401){location='/admin-login.html';throw 0}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){const d=await api('/api/admin/communities?search='+encodeURIComponent(document.getElementById('q').value)+'&status='+encodeURIComponent(document.getElementById('status').value));document.getElementById('rows').innerHTML=(d.communities||[]).map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div></td><td>${esc(c.owner_name||c.owner_username||'—')}</td><td>${esc(c.category)}</td><td>${esc(c.privacy)}</td><td>${c.member_count}</td><td>${c.post_count}</td><td class="${c.is_active?'active':'disabled'}">${c.is_active?'Active':'Disabled'}</td><td><div class="actions"><button class="btn dark" onclick="toggle(${c.id},${c.is_active})">${c.is_active?'Disable':'Enable'}</button><button class="btn dark" onclick="del(${c.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8">No communities.</td></tr>';const p=await api('/api/admin/community-posts?limit=50');document.getElementById('posts').innerHTML=(p.posts||[]).map(x=>`<div class="post"><b>${esc(x.community_name)}</b> · ${esc(x.full_name||x.username)}<p>${esc(x.body)}</p><small class="muted">${esc(x.created_at)}</small> <button class="btn dark" onclick="delPost(${x.id})">Delete</button></div>`).join('')||'<div class="muted">No posts.</div>'}async function toggle(id,current){await api('/api/admin/communities/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:current?0:1})});load()}async function del(id){if(!confirm('Delete this community and its posts?'))return;const r=await fetch('/api/admin/communities/'+id,{method:'DELETE'});const d=await r.json();if(!r.ok){alert(d.message||'Permission denied');return}load()}async function delPost(id){if(!confirm('Delete this post?'))return;await api('/api/admin/community-posts/'+id,{method:'DELETE'});load()}load();</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
