<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost | Membership</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:28px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#ffd21f;font-size:24px;font-weight:900}.sub{color:#999}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{background:linear-gradient(145deg,#171717,#0a0a0a);border:1px solid #4a3900;border-radius:20px;padding:24px}.card.featured{box-shadow:0 0 35px rgba(255,210,31,.12)}h1,h2{color:#ffd21f}h1{text-align:center;font-size:42px}.price{font-size:28px;font-weight:900}.muted{color:#999;line-height:1.6}button{width:100%;padding:13px;border:0;border-radius:10px;background:#ffd21f;font-weight:800;cursor:pointer;margin-top:16px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#2a2100;color:#ffd21f;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:32px}}</style>
<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="wrap"><div class="top"><div><div class="brand">GOLDEN GHOST 👻</div><div class="sub">Membership</div></div><a href="/user-dashboard.html" style="color:#ffd21f">Dashboard →</a></div><h1>Chagua Membership Yako</h1><p class="muted" style="text-align:center">Bei hizi ni za mfumo ulioweka. Hakuna malipo ya uongo: checkout inabaki imefungwa mpaka payment provider halisi iunganishwe.</p><div id="grid" class="grid"></div></div><script>const plans=[{id:'free',name:'Free',m:0,y:0,desc:'Anza na Golden Ghost bila malipo.'},{id:'plus',name:'Plus',m:5000,y:45000,desc:'Limits kubwa zaidi na features za ziada.'},{id:'premium',name:'Premium',m:12000,y:108000,desc:'Tier ya juu yenye limits kubwa zaidi.'}];async function load(){try{const r=await fetch('/api/user/membership');if(!r.ok){location.href='/login.html';return}const d=await r.json();grid.innerHTML=plans.map(p=>`<div class="card ${p.id==='premium'?'featured':''}"><span class="badge">${p.id===d.current.plan?'CURRENT':''}</span><h2>${p.name}</h2><div class="price">TSh ${p.m.toLocaleString()} <span style="font-size:13px;color:#999">/ mwezi</span></div><p class="muted">TSh ${p.y.toLocaleString()} / mwaka</p><p class="muted">${p.desc}</p><button ${p.id==='free'||!d.paymentConfigured?'disabled':''} onclick="checkout('${p.id}')">${p.id==='free'?'ACTIVE / FREE':d.paymentConfigured?'CHAGUA PLAN':'PAYMENT HAJAUNGANISHWA'}</button></div>`).join('')}catch(e){grid.innerHTML='<p class="muted">Imeshindikana kupakia membership.</p>'}}async function checkout(plan){const r=await fetch('/api/user/membership/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});const d=await r.json();alert(d.message)}load();</script></body></html>
