<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost | Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505;color:#fff;font-family:Arial;display:grid;place-items:center}.box{width:min(430px,92%);padding:34px;background:linear-gradient(145deg,#171717,#090909);border:1px solid #4a3900;border-radius:24px;box-shadow:0 20px 70px #000}.logo{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 18px rgba(255,210,31,.3))}h1{text-align:center;color:#ffd21f;margin:5px 0 8px}.sub{text-align:center;color:#999;margin-bottom:25px}label{display:block;color:#ddd;font-weight:bold;font-size:13px;margin:0 0 8px}input{width:100%;padding:14px;margin-bottom:18px;background:#080808;color:#fff;border:1px solid #3a3000;border-radius:11px;outline:none}input:focus{border-color:#ffd21f}button{width:100%;padding:14px;border:0;border-radius:11px;background:#ffd21f;color:#090909;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#message{text-align:center;min-height:22px;margin-top:15px}.links{text-align:center;margin-top:22px;color:#888}.links a{color:#ffd21f;text-decoration:none;margin:0 5px}</style>

</head><body><script>fetch('/api/user/session',{credentials:'same-origin'}).then(r=>{if(r.ok)location.replace('/user-dashboard.html')}).catch(()=>{});</script><main class="box"><img src="golden-ghost-logo.png" class="logo" alt="Golden Ghost"><h1>WELCOME BACK</h1><p class="sub">Ingia kwenye akaunti yako ya Golden Ghost</p><form id="loginForm"><label for="identifier">Username au Email</label><input id="identifier" required autocomplete="username" placeholder="Username au email"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Password"><button id="submit" type="submit">LOG IN</button><div id="message"></div></form><div class="links"><a href="signup.html">Create Account</a> · <a href="index.html">Home</a></div></main><script>const f=document.getElementById('loginForm'),m=document.getElementById('message'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='Inathibitisha...';m.style.color='#f59e0b';try{const r=await fetch('/api/user/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({identifier:identifier.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Login imeshindikana.');m.textContent='Login imefanikiwa!';m.style.color='#22c55e';setTimeout(()=>location.href='/user-dashboard.html',400)}catch(err){m.textContent=err.message;m.style.color='#ef4444';b.disabled=false}});</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
