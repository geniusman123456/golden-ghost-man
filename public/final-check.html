<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Final Check</title><link rel="stylesheet" href="/admin-suite.css">  <link rel="manifest" href="/manifest.webmanifest">

</head><body><div class="shell"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>GOLDEN GHOST</b><small>Final QA</small></div></div><nav class="nav"><a href="/dashboard.html">🏠 Dashboard</a><a href="/users.html">👥 Users</a><a href="/transactions.html">💳 Transactions</a><a href="/payments.html">💰 Payments</a><a href="/reports.html">📊 Reports</a><a href="/notifications.html">🔔 Notifications</a><a href="/settings.html">⚙️ Settings</a><a href="/security.html">🛡️ Security</a><a href="/system-health.html">🩺 System Health</a></nav></aside><main class="main"><div class="top"><div><h1>Final QA Check</h1><div class="muted">Checklist ya hatua 1–11. Hatua 10 imeachwa mpaka credentials za AzamPay zipatikane.</div></div><button class="btn gold" onclick="run()">Run tests</button></div><div id="list" class="card"></div></main></div><script src="/admin-suite.js"></script><script>const tests=[['Authentication','/api/admin/session'],['Dashboard summary','/api/admin/dashboard-summary'],['Users API','/api/admin/users'],['Transactions API','/api/admin/transactions'],['Payments API','/api/admin/payments'],['Reports API','/api/admin/reports/summary'],['Notifications API','/api/admin/notifications'],['Security API','/api/admin/security'],['Settings API','/api/admin/settings'],['System health','/api/admin/system-health']];async function run(){const out=[];for(const [name,url] of tests){try{const r=await fetch(url,{credentials:'same-origin'});out.push(`<div class="notice"><b class="ok">PASS</b> — ${esc(name)} <span class="muted">(${r.status})</span></div>`)}catch(e){out.push(`<div class="notice"><b class="err">FAIL</b> — ${esc(name)}</div>`)}}out.push(`<div class="notice goldline"><b>STEP 10</b> — AzamPay credentials/payment test: <span class="warn">WAITING</span></div>`);document.getElementById('list').innerHTML=out.join('')}run()</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
