<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Payments</title><style>body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.gold{color:#e7b93f}.card{background:#111;border:1px solid #30250b;border-radius:18px;padding:20px;margin:16px 0}input,select,button{padding:12px;border-radius:10px;border:1px solid #39300f;background:#090909;color:#fff}button{background:#e7b93f;color:#111;font-weight:800;cursor:pointer}.filters{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:12px;border-bottom:1px solid #282828;text-align:left}.scroll{overflow:auto}.pending{color:#e7b93f}.processing{color:#70c8ff}.completed{color:#6ee7a2}.failed{color:#ff7070}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="wrap"><div class="top"><h1>Golden <span class="gold">Ghost</span> — Payment Center</h1><button onclick="location='/dashboard.html'">← Dashboard</button></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b>Provider health:</b> <span id="health">—</span></div><button onclick="healthCheck()">Test provider</button></div></div><div class="card"><div class="filters"><input id="search" placeholder="Search payment/reference/user"><select id="status"><option value="">All status</option><option>pending</option><option>processing</option><option>completed</option><option>failed</option></select><select id="method"><option value="">All methods</option><option value="visa">Visa</option><option value="mastercard">Mastercard</option><option value="mpesa">M-Pesa</option><option value="airtel_money">Airtel Money</option><option value="tigo_pesa">Tigo Pesa</option><option value="bank_transfer">Bank Transfer</option></select><button onclick="load()">Refresh</button></div></div><div class="card"><div class="scroll"><table><thead><tr><th>ID</th><th>User</th><th>Method</th><th>Amount</th><th>Provider</th><th>Status</th><th>Reference</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const money=n=>'TZS '+(Number(n)/100).toLocaleString('en-TZ',{minimumFractionDigits:2});async function load(){const q=new URLSearchParams({search:search.value,status:status.value,method:method.value});const r=await fetch('/api/admin/payments?'+q);if(!r.ok){location='/admin-login.html';return}const d=await r.json();rows.innerHTML=d.payments.map(p=>`<tr><td>${p.id}</td><td>${p.username||p.email||p.user_id}</td><td>${p.method}</td><td>${money(p.amount_cents)}</td><td>${p.provider}</td><td class="${p.status}">${p.status}</td><td>${p.provider_reference||p.transaction_reference||'—'}</td><td>${p.status==='pending'?`<button onclick="change(${p.id},'processing')">Processing</button> <button onclick="change(${p.id},'completed')">Complete</button> <button onclick="change(${p.id},'failed')">Fail</button>`:p.status==='processing'?`<button onclick="change(${p.id},'completed')">Complete</button> <button onclick="change(${p.id},'failed')">Fail</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8">Hakuna payments.</td></tr>'}async function change(id,status){const ref=status==='completed'?prompt('Provider reference (optional):')||null:null;const r=await fetch('/api/admin/payments/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,provider_reference:ref})});const d=await r.json();if(!r.ok)alert(d.message||'Imeshindikana');load()}async function healthCheck(){health.textContent='Testing...';try{const r=await fetch('/api/admin/payment-health');const d=await r.json();if(d.ok)health.textContent='OK — '+(d.provider||'provider')+(d.sandbox?' (sandbox)':'');else if(d.reason==='NOT_CONFIGURED')health.textContent='Not configured';else health.textContent='Failed — '+(d.reason||'provider error')}catch(e){health.textContent='Request failed'}}load();healthCheck()</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
