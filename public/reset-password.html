<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost | Reset Password</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial}.box{width:min(430px,90%);padding:32px;background:#111;border:1px solid #4a3900;border-radius:22px;box-shadow:0 20px 70px #000}img{width:110px;display:block;margin:auto}h1{color:#ffd21f;text-align:center}input{width:100%;box-sizing:border-box;padding:14px;margin:12px 0;background:#080808;color:#fff;border:1px solid #3a3000;border-radius:10px}button{width:100%;padding:14px;background:#ffd21f;border:0;border-radius:10px;font-weight:800;cursor:pointer}#m{text-align:center;min-height:24px;color:#aaa}</style>
<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="box"><img src="golden-ghost-logo.png"><h1>RESET PASSWORD</h1><form id="f"><input id="password" type="password" minlength="8" required placeholder="New password"><input id="confirm" type="password" minlength="8" required placeholder="Confirm password"><button>CHANGE PASSWORD</button></form><p id="m"></p></main><script>const token=new URLSearchParams(location.search).get('token');f.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){m.textContent='Passwords hazifanani.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})});const d=await r.json();m.textContent=d.message||'Done';m.style.color=r.ok?'#22c55e':'#ef4444';if(r.ok)setTimeout(()=>location.href='/login.html',1200)}catch(_){m.textContent='Imeshindikana kuwasiliana na server.'}})</script></body></html>
