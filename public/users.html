<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Management — Golden Ghost</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#070707;color:#eee;min-height:100vh}.wrap{max-width:1300px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:#999;font-size:13px}.actions{display:flex;gap:10px}.btn{border:1px solid #333;background:#111;color:#eee;border-radius:10px;padding:11px 15px;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#d9a928,#ffe082);color:#111;border:0;font-weight:700}.card{background:#0d0d0d;border:1px solid #252525;border-radius:16px;padding:20px;box-shadow:0 12px 35px #0008}.filters{display:grid;grid-template-columns:1fr 180px auto;gap:10px;margin-bottom:16px}.filters input,.filters select,.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #333;background:#080808;color:#fff;outline:none}.filters input:focus,.filters select:focus,.field input:focus{border-color:#d9a928}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{text-align:left;padding:14px 10px;border-bottom:1px solid #242424;font-size:13px}.table th{color:#999;font-weight:600}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:11px}.active{background:#12351e;color:#6ee58a}.inactive{background:#333;color:#aaa}.suspended{background:#351616;color:#ff8c8c}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:7px 9px;font-size:11px}.notice{min-height:20px;margin:10px 0;color:#f2cf63;font-size:13px}.empty{text-align:center;padding:45px;color:#777}.muted{color:#999;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal .card{width:450px;max-width:100%}.close{float:right;background:none;border:0;color:#999;font-size:22px;cursor:pointer}.field{margin-bottom:13px}.field label{display:block;color:#bbb;font-size:12px;margin-bottom:7px}.modal .btn{margin-top:5px}@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.filters{grid-template-columns:1fr}.wrap{padding:18px}}
</style>

<style>
.top{position:relative;overflow:hidden}.top::after{content:"";position:absolute;right:0;top:0;width:260px;height:100%;background:url('ghost-wide.png') center/cover;opacity:.12;pointer-events:none}.card{position:relative;overflow:hidden}.card::after{content:"";position:absolute;right:-30px;bottom:-35px;width:150px;height:110px;background:url('ghost-cinematic.png') center/cover;border-radius:20px;opacity:.1;pointer-events:none}
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="Golden Ghost"><div><h1>Users Management</h1><p>Usimamizi wa accounts za watumiaji wa mfumo</p></div></div>
    <div class="actions"><button class="btn" onclick="location.href='/dashboard.html'">← Dashboard</button><button class="btn gold" onclick="openCreate()">+ Ongeza User</button></div>
  </div>
  <div class="card">
    <div class="filters">
      <input id="search" placeholder="Tafuta username, email au jina..."><select id="status"><option value="">Status zote</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option></select><button class="btn gold" onclick="load()">Tafuta</button>
    </div>
    <div id="notice" class="notice"></div>
    <div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Email</th><th>Status</th><th>Created</th><th>Vitendo</th></tr></thead><tbody id="users"><tr><td colspan="6" class="empty">Inapakia...</td></tr></tbody></table></div>
  </div>
</div>
<div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">Ongeza User</h2><p class="muted">Jaza taarifa za msingi. Password/login ya user tutajenga kwenye hatua ya authentication ya users.</p><form id="userForm"><input type="hidden" id="userId"><div class="field"><label>Username</label><input id="username" minlength="3" maxlength="40" placeholder="Mfano: user01"></div><div class="field"><label>Email</label><input id="email" type="email" maxlength="150" placeholder="user@example.com"></div><div class="field"><label>Full name</label><input id="fullName" maxlength="100" placeholder="Jina kamili"></div><div class="field" id="statusField"><label>Status</label><select id="userStatus"><option value="active">Active</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option></select></div><button class="btn gold" type="submit">Hifadhi</button></form></div></div>
<script>
let users=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await r.json()}catch{}if(r.status===401){location.href='/admin-login.html';throw Error('Session expired')}if(!r.ok)throw Error(d.message||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function statusBadge(s){const cls=s==='active'?'active':s==='suspended'?'suspended':'inactive';return `<span class="badge ${cls}">${esc(s||'inactive')}</span>`}
async function load(){try{const q=new URLSearchParams({search:document.getElementById('search').value,status:document.getElementById('status').value});const d=await api('/api/admin/users?'+q.toString());users=d.users;render();}catch(e){document.getElementById('notice').textContent=e.message}}
function render(){const b=document.getElementById('users');if(!users.length){b.innerHTML='<tr><td colspan="6" class="empty">Hakuna users bado.</td></tr>';return}b.innerHTML=users.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.full_name||u.username||'—')}</b>${u.username?`<div style="color:#888;font-size:11px;margin-top:3px">@${esc(u.username)}</div>`:''}</td><td>${esc(u.email||'—')}</td><td>${statusBadge(u.status)}</td><td>${esc(u.created_at||'—')}</td><td><div class="row-actions"><button class="btn small" onclick="editUser(${u.id})">Hariri</button>${u.status==='active'?`<button class="btn small" onclick="setStatus(${u.id},'inactive')">Zima</button>`:`<button class="btn small" onclick="setStatus(${u.id},'active')">Washa</button>`}</div></td></tr>`).join('')}
function openCreate(){document.getElementById('modalTitle').textContent='Ongeza User';document.getElementById('userId').value='';document.getElementById('username').value='';document.getElementById('email').value='';document.getElementById('fullName').value='';document.getElementById('userStatus').value='active';document.getElementById('statusField').style.display='none';document.getElementById('modal').classList.add('open')}
function editUser(id){const u=users.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Hariri User';document.getElementById('userId').value=id;document.getElementById('username').value=u.username||'';document.getElementById('email').value=u.email||'';document.getElementById('fullName').value=u.full_name||'';document.getElementById('userStatus').value=u.status||'active';document.getElementById('statusField').style.display='block';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('userForm').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('userId').value;const body={username:document.getElementById('username').value.trim(),email:document.getElementById('email').value.trim(),full_name:document.getElementById('fullName').value.trim()};if(id)body.status=document.getElementById('userStatus').value;try{await api(id?'/api/admin/users/'+id:'/api/admin/users',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();document.getElementById('notice').textContent='Mabadiliko yamehifadhiwa.';load()}catch(e){document.getElementById('notice').textContent=e.message}}
async function setStatus(id,status){try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({status})});document.getElementById('notice').textContent='Status imebadilishwa.';load()}catch(e){document.getElementById('notice').textContent=e.message}}
load();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
