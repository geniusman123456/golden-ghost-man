<!doctype html>
<html lang="sw">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Login</title>
<style>body{margin:0;background:#050505;color:#eee;font-family:Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 32px));padding:32px;background:linear-gradient(145deg,#151515,#090909);border:1px solid #3a2b08;border-radius:24px;box-shadow:0 25px 80px #000}.logo{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 14px}h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#999}.gold{color:#e7b93f}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;border:1px solid #3a3012;background:#090909;color:#fff}button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#f0c84b,#a87810);color:#090909;font-weight:900;cursor:pointer;margin-top:18px}.links{text-align:center;margin-top:18px}.links a{color:#e7b93f;text-decoration:none}.notice{margin-top:14px;padding:12px;border-radius:10px;background:#0d0d0d;border:1px solid #292929;color:#aaa;font-size:14px}.err{color:#ff7070}.ok{color:#6ee7a2}</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head>
<body>
<main class="box">
<img src="golden-ghost-logo.png" class="logo" alt="Golden Ghost">
<h1>WELCOME <span class="gold">BACK</span></h1>
<p class="sub">Ingia kwenye akaunti yako ya Golden Ghost</p>
<div id="serverNotice" class="notice" hidden></div>
<form id="loginForm">
<label for="identifier">Username au Email</label><input id="identifier" required autocomplete="username" placeholder="Username au email">
<label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Password">
<button id="submit" type="submit">LOG IN</button><div id="message" class="notice" hidden></div>
</form>
<div class="links"><a href="signup.html">Create Account</a> · <a href="forgot-password.html">Forgot Password?</a> · <a href="index.html">Home</a></div>
</main>
<script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submit'),notice=document.getElementById('serverNotice');
const show=(el,text,cls='')=>{el.hidden=false;el.textContent=text;el.className='notice '+cls};
async function checkServer(){
  if(location.protocol==='file:'){
    show(notice,'Umefungua HTML moja kwa moja. Golden Ghost inahitaji server. Nakupeleka kwenye http://localhost:3000/login.html…','err');
    setTimeout(()=>{location.href='http://localhost:3000/login.html'},900);return false;
  }
  try{const r=await fetch('/api/health',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error();return true}
  catch(e){show(notice,'Server ya Golden Ghost haijawashwa. Fungua START-WINDOWS.bat au tumia: npm install kisha npm start.','err');return false}
}
(async()=>{if(await checkServer()){try{const r=await fetch('/api/user/session',{credentials:'same-origin',cache:'no-store'});if(r.ok)location.replace('/user-dashboard.html')}catch(e){}}})();
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;show(msg,'Inathibitisha…');try{if(!(await checkServer())){btn.disabled=false;return}const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({identifier:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok){ const m=d.message||('Login imeshindikana (HTTP '+r.status+').'); if(r.status===401) throw Error(m+' Kama ni mara ya kwanza, tengeneza account kupitia Create Account au tumia credentials za Initial User ulizoweka kwenye setup.'); throw Error(m); }show(msg,'Login imefanikiwa!','ok');setTimeout(()=>location.href='/user-dashboard.html',300)}catch(err){show(msg,err.message||'Failed to connect to server.','err');btn.disabled=false}});
</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
