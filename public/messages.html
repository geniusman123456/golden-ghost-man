<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages • Golden Ghost</title><link rel="stylesheet" href="/admin-suite.css"><style>body{background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;margin-bottom:20px}.gold{color:#ffd21f;font-weight:800}.panel{background:#0b0e0f;border:1px solid #463700;border-radius:20px;padding:20px}.thread{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1px solid #202526;text-decoration:none;color:#fff}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #ffd21f}.muted{color:#8d9698;font-size:13px}.empty{text-align:center;padding:50px;color:#8d9698}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="head"><div><div class="gold">GOLDEN GHOST</div><div class="muted">Your conversations</div></div><a class="gold" href="/user-dashboard.html">← Dashboard</a></div><section class="panel"><h2>💬 Messages</h2><div id="list"><div class="empty">Loading...</div></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u){const r=await fetch(u);if(r.status===401){location='/login.html';throw 0}return r.json()}async function load(){const d=await api('/api/user/messages');document.getElementById('list').innerHTML=(d.people||[]).map(x=>`<a class="thread" href="/chat.html?user=${x.id}"><img class="avatar" src="/logo.png"><div><b>${esc(x.full_name||x.username)}</b><div class="muted">${esc(x.country||'Global')} • ${esc(x.language||'')}</div><div class="muted">Last message: ${esc(x.last_message_at||'')}</div></div></a>`).join('')||'<div class="empty">Huna direct messages bado. Nenda Discover People kuanza.</div>}load();</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
