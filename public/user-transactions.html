<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Transactions</title><link rel="stylesheet" href="/admin-suite.css"><style>body{background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{color:#ffd21f;font-weight:900;font-size:22px}.nav{color:#ffd21f}.panel{background:#0b0e0f;border:1px solid #3b3100;border-radius:20px;padding:20px;margin-top:18px}.table{overflow:auto}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #202526;text-align:left}.muted{color:#899197}.status{font-weight:800}.pending{color:#ffd21f}.completed{color:#55df9a}.failed{color:#ff6d75}.deposit{color:#55df9a}.withdrawal{color:#ff6d75}.empty{text-align:center;padding:50px;color:#899197}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="top"><div><div class="brand">GOLDEN GHOST</div><div class="muted">Your transactions</div></div><a class="nav" href="/user-dashboard.html">← Dashboard</a></div><section class="panel"><h2>↔ Transactions</h2><p class="muted">Transactions za akaunti yako pekee.</p><div id="msg" class="muted"></div><div class="table"><table><thead><tr><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th><th>Note</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div></section></main><script>const money=n=>'TZS '+(Number(n||0)/100).toLocaleString('en-TZ',{minimumFractionDigits:2});async function load(){const r=await fetch('/api/user/wallet');if(!r.ok){location='/login.html';return}const d=await r.json();document.getElementById('rows').innerHTML=(d.transactions||[]).map(t=>`<tr><td>${t.reference}</td><td class="${t.type}">${t.type}</td><td class="${t.type}">${t.type==='deposit'?'+':'−'} ${money(t.amount_cents)}</td><td class="status ${t.status}">${t.status}</td><td>${t.note||'—'}</td><td>${t.created_at}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Hakuna transactions bado.</td></tr>'}load();</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
