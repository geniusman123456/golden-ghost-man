<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Notifications</title><link rel="stylesheet" href="/admin-suite.css"><style>body{background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.brand{color:#ffd21f;font-weight:900}.nav{color:#ffd21f}.panel{background:#0b0e0f;border:1px solid #3b3100;border-radius:20px;padding:20px;margin-top:18px}.item{padding:15px;border-bottom:1px solid #202526}.unread{border-left:3px solid #ffd21f;background:#11120e}.muted{color:#899197}.btn{background:#ffd21f;color:#080808;border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="wrap"><div class="top"><div><div class="brand">GOLDEN GHOST</div><div class="muted">Your notifications</div></div><a class="nav" href="/user-dashboard.html">← Dashboard</a></div><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🔔 Notifications</h2><button class="btn" id="all">Mark all read</button></div><div id="list">Loading...</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const r=await fetch('/api/user/notifications');if(r.status===401){location='/login.html';return}const d=await r.json();document.getElementById('list').innerHTML=(d.notifications||[]).map(n=>`<div class="item ${n.is_read?'':'unread'}"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><div class="muted">${esc(n.created_at)}</div>${n.is_read?'':'<button class="btn" onclick="readOne('+n.id+')">Mark read</button>'}</div>`).join('')||'<div class="muted">Hakuna notifications.</div>'}async function readOne(id){await fetch('/api/user/notifications/'+id+'/read',{method:'PUT'});load()}document.getElementById('all').onclick=async()=>{await fetch('/api/user/notifications/read-all',{method:'POST'});load()};load();</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
