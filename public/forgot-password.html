<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost | Forgot Password</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial}.box{width:min(430px,90%);padding:32px;background:#111;border:1px solid #4a3900;border-radius:22px;box-shadow:0 20px 70px #000}img{width:110px;display:block;margin:auto}h1{color:#ffd21f;text-align:center}p{color:#aaa;line-height:1.5}input{width:100%;box-sizing:border-box;padding:14px;margin:12px 0;background:#080808;color:#fff;border:1px solid #3a3000;border-radius:10px}button{width:100%;padding:14px;background:#ffd21f;border:0;border-radius:10px;font-weight:800;cursor:pointer}#m{min-height:24px;text-align:center}</style>
<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="box"><img src="golden-ghost-logo.png"><h1>FORGOT PASSWORD</h1><p>Weka email yako. Kama ipo kwenye mfumo, tutakutumia reset link.</p><form id="f"><input id="email" type="email" required placeholder="Email"><button>CONTINUE</button></form><p id="m"></p><p style="text-align:center"><a href="/login.html" style="color:#ffd21f">← Login</a></p></main><script>f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Inatuma...';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim()})});const d=await r.json();m.textContent=d.devResetUrl?d.message+' DEV: '+d.devResetUrl:d.message;m.style.color=r.ok?'#22c55e':'#ef4444'}catch(_){m.textContent='Imeshindikana kuwasiliana na server.';m.style.color='#ef4444'}})</script></body></html>
