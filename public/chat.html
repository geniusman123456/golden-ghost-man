<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat • Golden Ghost</title><link rel="stylesheet" href="/admin-suite.css"><style>body{margin:0;background:#050606;color:#fff;font-family:Inter,system-ui,sans-serif}.chat{max-width:900px;height:100vh;margin:auto;display:flex;flex-direction:column;background:#080b0c}.head{padding:18px 22px;border-bottom:1px solid #3c3208;display:flex;align-items:center;gap:14px}.avatar{width:46px;height:46px;border-radius:50%;border:2px solid #ffd21f}.name{font-weight:800}.muted{color:#899193;font-size:13px}.msgs{flex:1;overflow:auto;padding:24px}.bubble{max-width:72%;padding:12px 15px;border-radius:16px;background:#13191b;margin:8px 0;border:1px solid #232a2c}.mine{margin-left:auto;background:#806500;color:#fff;border-color:#ffd21f}.time{font-size:11px;color:#aeb5b7;margin-top:5px}.form{display:flex;gap:10px;padding:18px;border-top:1px solid #2b300f}.form input{flex:1;background:#11171a;border:1px solid #2c3436;border-radius:14px;padding:14px;color:#fff}.form button{background:#ffd21f;border:0;border-radius:14px;padding:0 22px;font-weight:900}.empty{text-align:center;color:#8b9395;padding:50px}.back{color:#ffd21f;text-decoration:none}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="chat"><header class="head"><a class="back" href="/messages.html">←</a><img id="avatar" class="avatar" src="/logo.png"><div><div id="name" class="name">Loading...</div><div id="meta" class="muted">Golden Ghost member</div></div></header><div id="msgs" class="msgs"><div class="empty">Loading conversation...</div></div><form id="form" class="form"><input id="input" maxlength="1000" placeholder="Type a message..." autocomplete="off"><button>➤</button></form></main><script>const qs=new URLSearchParams(location.search),id=Number(qs.get('user'));const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});if(r.status===401){location='/login.html';throw Error('AUTH')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){if(!id){location='/discover.html';return}const [me,d]=await Promise.all([api('/api/user/me'),api('/api/user/messages/'+id)]);$('name').textContent=d.user.full_name||d.user.username;$('meta').textContent=(d.user.country||'Global')+' • '+(d.user.language||'');$('msgs').innerHTML=(d.messages||[]).map(m=>`<div class="bubble ${Number(m.sender_id)===Number(me.id)?'mine':''}">${esc(m.message)}<div class="time">${esc(m.created_at)}</div></div>`).join('')||'<div class="empty">Anza mazungumzo.</div>';$('msgs').scrollTop=$('msgs').scrollHeight}$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;try{await api('/api/user/messages/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});$('input').value='';await load()}catch(e){alert(e.message)}};load();setInterval(()=>load().catch(()=>{}),5000);</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
