<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Wallet</title><style>body{margin:0;background:#050505;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:contain}.gold{color:#e7b93f}.card{background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid #30250b;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 15px 45px #000}.balance{font-size:46px;font-weight:900;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:11px;border:1px solid #3a3012;background:#090909;color:#fff;margin:7px 0}button{background:linear-gradient(135deg,#f0c84b,#a87810);color:#090909;font-weight:900;cursor:pointer}.muted{color:#999}.notice{padding:12px;border-radius:10px;background:#0d0d0d;border:1px solid #292929}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}td,th{padding:13px;border-bottom:1px solid #292929;text-align:left}.status{font-weight:800}.pending{color:#e7b93f}.completed{color:#6ee7a2}.failed{color:#ff7070}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.balance{font-size:36px}}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="wrap"><div class="top"><div class="brand"><img src="logo.png" alt="Golden Ghost"><div><strong>GOLDEN <span class="gold">GHOST</span></strong><div class="muted">Wallet & Transactions</div></div></div><button style="width:auto;padding:10px 16px" onclick="location='/user-dashboard.html'">← Dashboard</button></div><div class="card"><div class="muted">Available balance</div><div id="balance" class="balance">TZS 0.00</div><div class="notice muted">Deposits na withdrawals zinaanza kama <b>Pending</b> na zitaongeza/kupunguza balance baada ya kuthibitishwa na admin.</div></div><div class="card"><h2>💳 Pay / Deposit</h2><div class="muted">Chagua njia ya malipo</div><select id="method" style="width:100%;box-sizing:border-box;padding:14px;border-radius:11px;border:1px solid #3a3012;background:#090909;color:#fff;margin:7px 0"><option value="visa">Visa</option><option value="mastercard">Mastercard</option><option value="mpesa">M-Pesa</option><option value="airtel_money">Airtel Money</option><option value="tigo_pesa">Tigo Pesa</option><option value="bank_transfer">Bank Transfer</option></select><input id="payamount" type="number" min="1" step="0.01" placeholder="Amount TZS"><input id="payphone" placeholder="Namba ya simu (inahitajika kwa M-Pesa/Airtel/Tigo)"><button onclick="startPayment()">Anza Payment</button><div id="paymsg" class="muted"></div></div><div class="grid"><div class="card"><h2>➕ Deposit</h2><input id="dep" type="number" min="1" step="0.01" placeholder="Amount TZS"><input id="depn" maxlength="200" placeholder="Note (optional)"><button onclick="tx('deposit')">Omba Deposit</button></div><div class="card"><h2>➖ Withdrawal</h2><input id="wit" type="number" min="1" step="0.01" placeholder="Amount TZS"><input id="witn" maxlength="200" placeholder="Note (optional)"><button onclick="tx('withdrawal')">Omba Withdrawal</button></div></div><div class="card"><h2>Transaction history</h2><div id="msg" class="muted"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const money=n=>'TZS '+(Number(n)/100).toLocaleString('en-TZ',{minimumFractionDigits:2});async function load(){const r=await fetch('/api/user/wallet');if(!r.ok){location='/user-login.html';return}const d=await r.json();document.querySelector('#balance').textContent=money(d.wallet.balance_cents);document.querySelector('#rows').innerHTML=d.transactions.map(t=>`<tr><td>${t.reference}</td><td>${t.type}</td><td>${money(t.amount_cents)}</td><td class="status ${t.status}">${t.status}</td><td>${t.created_at}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Hakuna transactions bado.</td></tr>'}async function tx(type){const prefix=type==='deposit'?'dep':'wit';const el=document.getElementById(prefix);const amount=Number(el.value);const note=document.getElementById(prefix+'n').value.trim();if(!Number.isFinite(amount)||amount<=0){document.querySelector('#msg').textContent='Weka amount sahihi.';return}const r=await fetch('/api/user/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,amount,note})});const d=await r.json();document.querySelector('#msg').textContent=d.message||(r.ok?'Ombi limetumwa na linasubiri approval.':'Imeshindikana.');if(r.ok){el.value='';document.getElementById(prefix+'n').value='';load()}}async function startPayment(){const amount=Number(document.getElementById('payamount').value),method=document.getElementById('method').value;const key='gg-'+crypto.randomUUID();if(!Number.isFinite(amount)||amount<=0){document.getElementById('paymsg').textContent='Weka amount sahihi.';return}const r=await fetch('/api/user/payments',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify({amount,method,currency:'TZS',phone:document.getElementById('payphone').value.trim()})});const d=await r.json();document.getElementById('paymsg').textContent=d.message||(r.ok?'Payment imeandaliwa.':'Imeshindikana.');if(r.ok&&d.payment?.checkout_url)location.href=d.payment.checkout_url;load()}
load()</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
