<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Transactions</title><style>body{margin:0;background:#070707;color:#eee;font-family:Inter,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.gold{color:#e7b93f}.card{background:#111;border:1px solid #30250b;border-radius:18px;padding:20px;margin:18px 0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select,button{padding:12px;border-radius:10px;border:1px solid #3b3114;background:#090909;color:#fff}button{background:#d2a52e;color:#090909;font-weight:900;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}td,th{padding:12px;border-bottom:1px solid #292929;text-align:left}.pending{color:#e7b93f}.completed{color:#6ee7a2}.failed{color:#ff7070}.actions button{margin-right:5px}.muted{color:#999}@media(max-width:750px){.filters{grid-template-columns:1fr}}</style>  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="wrap"><div class="head"><div><h1>Transactions <span class="gold">Control</span></h1><p class="muted">Review na approval ya miamala ya users.</p></div><button onclick="location='/dashboard.html'">← Dashboard</button></div><div class="card"><div class="filters"><input id="search" placeholder="Reference, username au email"><select id="status"><option value="">Status zote</option><option>pending</option><option>completed</option><option>failed</option></select><select id="type"><option value="">Aina zote</option><option>deposit</option><option>withdrawal</option></select><button onclick="load()">Tafuta</button></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const money=n=>'TZS '+(Number(n)/100).toLocaleString('en-TZ',{minimumFractionDigits:2});async function load(){const q=new URLSearchParams({search:document.getElementById('search').value,status:document.getElementById('status').value,type:document.getElementById('type').value});const r=await fetch('/api/admin/transactions?'+q);if(!r.ok){location='/admin-login.html';return}const d=await r.json();document.getElementById('rows').innerHTML=d.transactions.map(t=>`<tr><td>${t.id}</td><td>${t.username||'-'}<br><span class="muted">${t.email||''}</span></td><td>${t.reference}</td><td>${t.type}</td><td>${money(t.amount_cents)}</td><td class="${t.status}">${t.status}</td><td>${t.created_at}</td><td class="actions">${t.status==='pending'?`<button onclick="setStatus(${t.id},'completed')">Approve</button><button onclick="setStatus(${t.id},'failed')">Fail</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">Hakuna transactions.</td></tr>'}async function setStatus(id,status){if(!confirm(status==='completed'?'Thibitisha transaction hii?':'Weka transaction hii kuwa failed?'))return;const r=await fetch('/api/admin/transactions/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)alert(d.message||'Imeshindikana');load()}load()</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
