<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost — Notifications</title><link rel="stylesheet" href="/admin-suite.css">  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d4af37">

<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><div class="shell"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>GOLDEN GHOST</b><small>Notifications</small></div></div><nav class="nav"><a href="/dashboard.html">🏠 Dashboard</a><a href="/users.html">👥 Users</a><a href="/transactions.html">💳 Transactions</a><a href="/payments.html">💰 Payments</a><a href="/reports.html">📊 Reports</a><a href="/notifications.html">🔔 Notifications</a><a href="/settings.html">⚙️ Settings</a><a href="/security.html">🛡️ Security</a><a href="/system-health.html">🩺 System Health</a></nav></aside><main class="main"><div class="top"><div><h1>Notifications & Activity</h1><div class="muted">Ujumbe unaonekana tu unapozalishwa na mfumo.</div></div><button class="btn gold" onclick="readAll()">Mark all read</button></div><div class="card"><h3>Admin notifications</h3><div id="list"></div></div><div class="card" style="margin-top:18px"><h3>Activity log</h3><div class="table-wrap"><table class="table"><thead><tr><th>Muda</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody id="activity"></tbody></table></div></div></main></div><script src="/admin-suite.js"></script><script>async function load(){const [n,a]=await Promise.all([api('/api/admin/notifications'),api('/api/admin/activity?limit=200')]);document.getElementById('list').innerHTML=n.notifications.length?n.notifications.map(x=>`<div class="notice ${x.is_read?'':'goldline'}"><b>${esc(x.title)}</b><div class="muted">${esc(x.message)}</div><small>${esc(x.created_at)} · ${x.is_read?'read':'unread'}</small>${x.is_read?'':' <button class="btn" onclick="readOne(${x.id})">Read</button>'}</div>`).join(''):'<div class="empty">Hakuna notifications.</div>';document.getElementById('activity').innerHTML=a.activities.length?a.activities.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.admin_username||'System')}</td><td>${esc(x.action)}</td><td>${esc(x.details||'')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Hakuna activity log.</td></tr>'}async function readOne(id){await api('/api/admin/notifications/'+id+'/read',{method:'PUT'});load()}async function readAll(){await api('/api/admin/notifications/read-all',{method:'POST'});load()}load().catch(e=>alert(e.message))</script><script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js').catch(() => {})); }
</script>
</body></html>
