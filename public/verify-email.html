<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ghost | Verify Email</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial}.box{width:min(460px,90%);padding:32px;background:#111;border:1px solid #4a3900;border-radius:22px;text-align:center;box-shadow:0 20px 70px #000}img{width:120px}h1{color:#ffd21f}p{color:#aaa;line-height:1.6}a,button{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:700}a{color:#111;background:#ffd21f}button{border:1px solid #ffd21f;background:transparent;color:#ffd21f;cursor:pointer}</style>
<script src="/gg-i18n.js" defer></script>
<script src="/pwa-install.js" defer></script>
</head><body><main class="box"><img src="golden-ghost-logo.png"><h1>VERIFY EMAIL</h1><p id="m">Tunathibitisha email yako...</p><a id="login" href="/login.html" style="display:none">Nenda Login</a></main><script>(async()=>{const m=document.getElementById('m'),token=new URLSearchParams(location.search).get('token');if(!token){m.textContent='Verification token haipo.';return}try{const r=await fetch('/api/auth/verify-email?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();m.textContent=d.message||'Imekamilika.';if(r.ok)document.getElementById('login').style.display='inline-block'}catch(e){m.textContent='Imeshindikana kuwasiliana na server.'}})()</script></body></html>
